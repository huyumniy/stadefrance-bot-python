  <body>
    <div class="main">
      <!-- Existing Inputs -->
      <div class="inputs">
        <h3>Initial Url</h3>
        <input
          type="text"
          id="initialUrl"
          name="initialUrl"
          placeholder="https://example.com"
        />
      </div>
      <!-- <div class="absolute-checkbox">
        <label for="useAdspower">Use adspower?</label>
        <input type="checkbox" id="useAdspower" name="useAdspower" />
      </div> -->
      <div id="adspowerApiContainer" style="display: none">
        <h3>Adspower API</h3>
        <input
          type="text"
          id="adspowerApi"
          name="AdspowerApi"
          placeholder="http://local.adspower.net:50325"
        />
      </div>
      <div id="browserAmountContainer" class="inputs">
        <h3>Browsers amount</h3>
        <input
          type="number"
          id="browserAmount"
          name="browserAmount"
          placeholder="1-9999"
        />
      </div>
      <div id="updateIntervalContainer" class="inputs">
        <h3>Update Interval</h3>
        <input
          type="number"
          id="updateInterval"
          name="updateInterval"
          placeholder="15"
        />
      </div>

      <!-- Proxy Input -->
      <div class="inputs proxy-input">
        <h3>Proxy input:</h3>
        <textarea
          name="proxyInput"
          class="textareaNormal"
          placeholder="ip:port:login:password&#10;ip:port:login:password&#10;ip:port:login:password&#10;"
        ></textarea>
      </div>
      <div class="input adspower-input" style="display: none">
        <h3>Adspower browsers:</h3>
        <textarea
          name="adspowerInput"
          class="textareaNormal"
          placeholder="9453&#10;9454&#10;9455&#10;9456"
        ></textarea>
      </div>

      <!-- Start Button -->
      <div class="buttons">
        <div class="start">
          <button id="run" class="active">Start</button>
        </div>
      </div>
    </div>

      async function start(button) {
        if (button.getAttribute("class") == "active") {
          button.innerHTML = "";
          button.style.color = "#0F2027";

          // Collect all input values
          const initialUrl = document.querySelector("#initialUrl").value;
          const updateInterval =
            document.querySelector("#updateInterval").value;
          const browsersAmount = document.querySelector("#browserAmount").value;
          const proxyInput = document.querySelector(
            'textarea[name="proxyInput"]'
          ).value;

          const adspowerApi = document.querySelector("#adspowerApi").value;
          const adspowerIds = document.querySelector(
            'textarea[name="adspowerInput"]'
          ).value;

          // Log or send data to the backend
          console.log({
            initialUrl,
            updateInterval,
            browsersAmount,
            proxyInput,
            // adspowerApi,
            // adspowerIds,
          });

          // Trigger Eel backend call with new parameters
          await eel.main(
            initialUrl,
            updateInterval,
            browsersAmount,
            proxyInput
            // adspowerApi,
            // adspowerIds
          )();

          // Close window after starting
          closeWindow();
        }
      }

      function closeWindow() {
        let new_window = open(location, "_self");
        new_window.top.close();
      }

      function main() {
        const button = document.querySelector("#run");
        if (button.innerHTML == "Start") start(button);
      }

      // Start button click event listener
      jQuery("#run").on("click", function () {
        main();
      });
